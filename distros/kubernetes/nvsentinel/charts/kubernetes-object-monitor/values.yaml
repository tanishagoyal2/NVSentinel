# Default values for kubernetes-object-monitor.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

logLevel: info

image:
  repository: ghcr.io/nvidia/nvsentinel/kubernetes-object-monitor
  pullPolicy: IfNotPresent
  tag: ""

podAnnotations: {}

maxConcurrentReconciles: 1
resyncPeriod: 5m
cacheSyncTimeout: 10m # Duration limiting startup cache synchronization.

# RBAC permissions are automatically generated based on the resources defined in policies.
# Nodes always get write permissions (patch/update) for annotations.
# All other resources get read-only permissions (get/list/watch).
policies:
  - name: node-not-ready
    enabled: true
    resource:
      group: ""
      version: v1
      kind: Node
    predicate:
      expression: |
        resource.status.conditions.filter(c, c.type == "Ready" && c.status == "False").size() > 0
    healthEvent:
      componentClass: Node
      isFatal: true
      message: "Node is not ready"
      recommendedAction: CONTACT_SUPPORT
      errorCode:
        - NODE_NOT_READY
      # Optional behavior overrides for this policy's generated HealthEvents.
      # Set either force or skip, never both in the same override block.
      # quarantineOverrides:
      #   force: true  # Force node cordon even if normal quarantine rules would not.
      #   skip: true   # Skip node cordon for this health event.
      # drainOverrides:
      #   force: true  # Force immediate pod eviction regardless of namespace drain mode.
      #   skip: true   # Skip pod eviction and mark the event as already drained.

  # Detects when NPD reports that XFS forcibly shut down a filesystem after a
  # serious filesystem or storage error.
  - name: NPDXfsShutdown
    enabled: false
    resource:
      group: ""
      version: v1
      kind: Node
    predicate:
      expression: |
        resource.status.conditions.exists(c,
          c.type == "XfsShutdown" &&
          c.status == "True" &&
          c.reason == "XfsHasShutdown")
    healthEvent:
      componentClass: Node
      isFatal: true
      message: "NPD reported an XFS filesystem shutdown"
      recommendedAction: REPLACE_VM
      errorCode:
        - NPD_XFS_SHUTDOWN

  # Detects an NPD-reported fatal UEFI CPER indicating an uncorrectable
  # platform hardware failure, such as a CPU, memory, or PCIe failure.
  - name: NPDCperHardwareErrorFatal
    enabled: false
    resource:
      group: ""
      version: v1
      kind: Node
    predicate:
      expression: |
        resource.status.conditions.exists(c,
          c.type == "CperHardwareErrorFatal" &&
          c.status == "True" &&
          c.reason == "CperHardwareErrorFatal")
    healthEvent:
      componentClass: Node
      isFatal: true
      message: "NPD reported a fatal CPER hardware error"
      recommendedAction: REPLACE_VM
      errorCode:
        - NPD_CPER_HARDWARE_ERROR_FATAL

  # Detects when NPD reports that a filesystem was remounted read-only,
  # preventing writes.
  - name: NPDReadonlyFilesystem
    enabled: false
    resource:
      group: ""
      version: v1
      kind: Node
    predicate:
      expression: |
        resource.status.conditions.exists(c,
          c.type == "ReadonlyFilesystem" &&
          c.status == "True" &&
          c.reason == "FilesystemIsReadOnly")
    healthEvent:
      componentClass: Node
      isFatal: true
      message: "NPD reported a read-only filesystem"
      recommendedAction: REPLACE_VM
      errorCode:
        - NPD_READONLY_FILESYSTEM

  # Example: Monitor a custom resource (e.g., a GPU Job)
  # Uncomment and modify to monitor your own custom resources
  #
  # - name: gpu-job-failed
  #   enabled: true
  #   resource:
  #     group: batch.example.com
  #     version: v1alpha1
  #     kind: GPUJob
  #     # Optional: restrict namespaced resources to this namespace.
  #     # Leave unset to watch all namespaces for this resource kind.
  #     namespace: gpu-operator
  #   predicate:
  #     # CEL expression to detect unhealthy state
  #     # Access the resource via 'resource' variable
  #     expression: |
  #       has(resource.status.state) && resource.status.state == "Failed"
  #   nodeAssociation:
  #     # Optional: CEL expression to map this resource to a specific node
  #     # This is useful for resources that run on specific nodes
  #     
  #     # Example 1: Direct node reference
  #     expression: resource.spec.nodeName
  #     
  #     # Example 2: Use lookup() to find the node from a related Pod
  #     # Useful when monitoring resources that reference other resources
  #     # expression: |
  #     #   lookup('v1', 'Pod', resource.metadata.namespace, resource.spec.podName).spec.nodeName
  #     
  #     # Example 3: Chain lookup() calls to traverse multiple resources
  #     # expression: |
  #     #   lookup('v1', 'Node', '', 
  #     #     lookup('v1', 'Pod', resource.metadata.namespace, resource.status.podName).spec.nodeName
  #     #   ).metadata.name
  #   healthEvent:
  #     componentClass: GPU
  #     isFatal: false
  #     message: "GPU job failed on node"
  #     recommendedAction: CONTACT_SUPPORT
  #     errorCode:
  #       - GPU_JOB_FAILED
  #     drainOverrides:
  #       skip: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

volumes:
  - name: socket
    hostPath:
      path: /var/run/nvsentinel
      type: DirectoryOrCreate

# Processing strategy for health events
# valid values: EXECUTE_REMEDIATION, STORE_ONLY
# default: EXECUTE_REMEDIATION
# EXECUTE_REMEDIATION: normal behavior; downstream modules may update cluster state.
# STORE_ONLY: observability-only behavior; event should be persisted/exported but should not modify cluster resources (i.e., no node conditions, no quarantine, no drain, no remediation).
processingStrategy: EXECUTE_REMEDIATION

# Pod priority for this component. Overridden by the matching global when that is set.
priorityClassName: ""
